{% extends "base.html" %}
{% block title %}Lançamentos{% endblock %}
{% block page_title %}Lançamentos{% endblock %}

{% block content %}
<!-- Add Form -->
<div class="card mb-2">
  <div class="card-title">Novo Lançamento</div>
  <div class="form-row">
    <div class="form-group" style="flex:2;min-width:200px;">
      <label class="form-label">Descrição</label>
      <input type="text" class="form-input" id="l-desc" placeholder="Ex: Supermercado, Almoço, Farmácia...">
    </div>
    <div class="form-group">
      <label class="form-label">Valor (R$)</label>
      <input type="number" class="form-input" id="l-val" placeholder="0,00" min="0" step="0.01">
    </div>
    <div class="form-group">
      <label class="form-label">Categoria</label>
      <select class="form-select" id="l-cat"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Tipo</label>
      <select class="form-select" id="l-type">
        <option value="expense">Gasto</option>
        <option value="income">Receita</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Data</label>
      <input type="date" class="form-input" id="l-date">
    </div>
    <div class="form-group" style="justify-content:flex-end;">
      <button class="btn btn-primary" onclick="addTransaction()" style="width:100%;">+ Adicionar</button>
    </div>
  </div>
</div>

<!-- Filters -->
<div style="display:flex;gap:10px;align-items:center;margin-bottom:1rem;flex-wrap:wrap;">
  <select class="form-select" id="filter-type" style="width:140px;" onchange="renderList()">
    <option value="">Todos os tipos</option>
    <option value="expense">Gastos</option>
    <option value="income">Receitas</option>
  </select>
  <select class="form-select" id="filter-cat" style="width:160px;" onchange="renderList()">
    <option value="">Todas as categorias</option>
  </select>
  <div style="margin-left:auto;font-size:13px;color:var(--text-3);" id="tx-count"></div>
</div>

<!-- List -->
<div class="card">
  <div class="tx-list" id="txList">
    <div class="no-data">Carregando...</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allTx = [];
let categories = [];

async function init() {
  // Set today as default date
  document.getElementById('l-date').value = new Date().toISOString().split('T')[0];

  // Load categories
  categories = await apiGet('/api/categories') || [];
  const catSelect = document.getElementById('l-cat');
  const filterCat = document.getElementById('filter-cat');
  categories.forEach(c => {
    catSelect.innerHTML += `<option value="${c.id}">${c.icon} ${c.name}</option>`;
    filterCat.innerHTML += `<option value="${c.name}">${c.name}</option>`;
  });

  await loadTransactions();
}

async function loadTransactions() {
  allTx = await apiGet(`/api/transactions?month=${AppState.month}&year=${AppState.year}`) || [];
  renderList();
}

function renderList() {
  const typeFilter = document.getElementById('filter-type').value;
  const catFilter = document.getElementById('filter-cat').value;

  let filtered = allTx.filter(t => {
    if (typeFilter && t.transaction_type !== typeFilter) return false;
    if (catFilter && t.category?.name !== catFilter) return false;
    return true;
  });

  document.getElementById('tx-count').textContent = `${filtered.length} lançamentos`;

  const list = document.getElementById('txList');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-data">Nenhum lançamento neste período. Use o Chat IA para registrar! 🤖</div>';
    return;
  }

  list.innerHTML = filtered.map(t => {
    const cat = t.category || { icon: '💰', color: '#888', name: 'Outros' };
    const isIncome = t.transaction_type === 'income';
    return `<div class="tx-item">
      <div class="tx-icon" style="background:${cat.color}22;">${cat.icon}</div>
      <div class="tx-info">
        <div class="tx-desc">${t.description}</div>
        <div class="tx-meta">${t.user?.name || '—'} · ${fmtDate(t.transaction_date)} · ${cat.name}</div>
      </div>
      <div class="tx-amount ${isIncome ? 'income' : 'expense'}" style="margin-right:8px;">
        ${isIncome ? '+' : '−'}${fmtBRL(t.amount)}
      </div>
      <button class="tx-del" onclick="deleteTx(${t.id})" title="Excluir">✕</button>
    </div>`;
  }).join('');
}

async function addTransaction() {
  const desc = document.getElementById('l-desc').value.trim();
  const val = parseFloat(document.getElementById('l-val').value);
  const catId = document.getElementById('l-cat').value;
  const type = document.getElementById('l-type').value;
  const txDate = document.getElementById('l-date').value;

  if (!desc || isNaN(val) || val <= 0) return toast('Preencha descrição e valor', 'error');

  const res = await apiPost('/api/transactions', {
    description: desc, amount: val,
    category_id: catId, transaction_type: type,
    transaction_date: txDate
  });

  if (res?.success) {
    toast('Lançamento adicionado!');
    document.getElementById('l-desc').value = '';
    document.getElementById('l-val').value = '';
    await loadTransactions();
  } else {
    toast('Erro ao salvar', 'error');
  }
}

async function deleteTx(id) {
  if (!confirm('Excluir este lançamento?')) return;
  const res = await apiDelete(`/api/transactions/${id}`);
  if (res?.success) {
    toast('Excluído!');
    await loadTransactions();
  }
}

function onMonthChange() { loadTransactions(); }

init();
</script>
{% endblock %}
