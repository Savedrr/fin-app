<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FinanceApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">₊</div>
      <div class="login-title">FinanceApp</div>
      <div class="login-sub">Controle financeiro do casal</div>
    </div>

    <div class="login-card">
      <div class="login-tabs">
        <button class="login-tab active" onclick="switchTab('login', this)">Entrar</button>
        <button class="login-tab" onclick="switchTab('register', this)">Criar conta</button>
      </div>

      <div id="error-msg" class="login-error"></div>

      <!-- Login Form -->
      <div id="tab-login">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="login-email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')doLogin()">
          </div>
          <div class="form-group">
            <label class="form-label">Senha</label>
            <input type="password" class="form-input" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="doLogin()">
            Entrar
          </button>
        </div>
      </div>

      <!-- Register Form -->
      <div id="tab-register" style="display:none;">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="form-group">
            <label class="form-label">Seu nome</label>
            <input type="text" class="form-input" id="reg-name" placeholder="João ou Maria">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="reg-email" placeholder="seu@email.com">
          </div>
          <div class="form-group">
            <label class="form-label">Senha</label>
            <input type="password" class="form-input" id="reg-pass" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')doRegister()">
          </div>
          <div class="form-group">
            <label class="form-label">Cor do avatar</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;" id="color-picker">
              <div class="color-opt active" data-color="#1DB976" style="width:28px;height:28px;border-radius:50%;background:#1DB976;cursor:pointer;border:2px solid #fff;transition:.15s;"></div>
              <div class="color-opt" data-color="#3B82F6" style="width:28px;height:28px;border-radius:50%;background:#3B82F6;cursor:pointer;border:2px solid transparent;transition:.15s;"></div>
              <div class="color-opt" data-color="#EC4899" style="width:28px;height:28px;border-radius:50%;background:#EC4899;cursor:pointer;border:2px solid transparent;transition:.15s;"></div>
              <div class="color-opt" data-color="#F59E0B" style="width:28px;height:28px;border-radius:50%;background:#F59E0B;cursor:pointer;border:2px solid transparent;transition:.15s;"></div>
              <div class="color-opt" data-color="#A855F7" style="width:28px;height:28px;border-radius:50%;background:#A855F7;cursor:pointer;border:2px solid transparent;transition:.15s;"></div>
              <div class="color-opt" data-color="#EF4444" style="width:28px;height:28px;border-radius:50%;background:#EF4444;cursor:pointer;border:2px solid transparent;transition:.15s;"></div>
            </div>
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="doRegister()">
            Criar conta
          </button>
        </div>
      </div>

      <div class="login-demo">
        <strong>Contas demo criadas automaticamente:</strong><br>
        voce@email.com · senha: 123456<br>
        esposa@email.com · senha: 123456
      </div>
    </div>
  </div>
</div>

<script>
let selectedColor = '#1DB976';

document.querySelectorAll('.color-opt').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.color-opt').forEach(e => e.style.border = '2px solid transparent');
    el.style.border = '2px solid #fff';
    selectedColor = el.dataset.color;
  });
});

function switchTab(tab, btn) {
  document.querySelectorAll('.login-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('tab-register').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('error-msg').style.display = 'none';
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  if (!email || !password) return showError('Preencha todos os campos');
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) window.location.href = data.redirect;
    else showError(data.message || 'Erro ao fazer login');
  } catch(e) { showError('Erro de conexão'); }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-pass').value;
  if (!name || !email || !password) return showError('Preencha todos os campos');
  if (password.length < 6) return showError('Senha deve ter pelo menos 6 caracteres');
  try {
    const res = await fetch('/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, color: selectedColor })
    });
    const data = await res.json();
    if (data.success) window.location.href = data.redirect;
    else showError(data.message || 'Erro ao criar conta');
  } catch(e) { showError('Erro de conexão'); }
}
</script>
</body>
</html>
